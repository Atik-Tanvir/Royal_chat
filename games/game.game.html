<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoyaleChat Live - 8 Item Prediction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }
        body {
            background-color: #080313;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 380px;
            height: 780px;
            background: linear-gradient(180deg, #1b0a33 0%, #090314 100%);
            border: 2px solid #ffcc00;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.25);
            overflow: hidden;
            position: relative;
        }
        
        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 204, 0, 0.3);
        }
        .title { font-weight: bold; color: #ffcc00; font-size: 13px; }
        .timer-box {
            background: #ff4757;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 8px rgba(255, 71, 87, 0.6);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            font-size: 11px;
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stats-bar span { color: #ffcc00; font-weight: bold; }

        .game-area {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Center Slot / Bowl Container */
        .slot-container {
            width: 110px;
            height: 110px;
            position: relative;
            margin: 5px 0;
            perspective: 600px;
        }
        .bowl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 30%, #b3b3b3 100%);
            border: 5px solid #e6e6e6;
            box-shadow: 0 8px 16px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
        }
        .bowl-inner {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        
        .slide-out {
            transform: translateY(-110px) rotate(-25deg);
            opacity: 0.8;
        }

        .status-text {
            font-size: 12px;
            color: #ffcc00;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }

        /* 8 Betting Cards Grid (4 Top, 4 Bottom) */
        .item-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .item-card {
            height: 75px;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 204, 0, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .item-card.selected {
            border-color: #ffffff !important;
            background: rgba(255, 204, 0, 0.2);
            box-shadow: 0 0 10px #ffcc00;
            transform: scale(1.05);
        }

        .item-icon { font-size: 22px; }
        .item-name { font-size: 11px; font-weight: bold; color: #ffcc00; margin-top: 2px; }
        .user-bet { font-size: 10px; margin-top: 3px; background: rgba(0,0,0,0.5); padding: 1px 5px; border-radius: 6px; color: #fff; }

        /* Custom Coin Input Controls */
        .coin-controls {
            width: 100%;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-qty {
            width: 38px;
            height: 38px;
            background: #251642;
            border: 2px solid #ffcc00;
            color: #ffcc00;
            border-radius: 8px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .coin-input {
            width: 120px;
            height: 38px;
            background: #110826;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            color: #ffcc00;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            outline: none;
        }
        
        .chips-presets {
            display: flex;
            justify-content: space-around;
        }
        .chip-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,204,0,0.3);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            padding: 10px;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            border-top: 1px solid rgba(255,204,0,0.2);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <span class="title">👑 RoyaleChat (8 Item Slot)</span>
        <div class="timer-box" id="timer">00:35</div>
    </div>

    <!-- Live Board Stats -->
    <div class="stats-bar">
        <div>কাস্টমার ব্যালেন্স: <span id="balanceHeader">50,000</span> 🪙</div>
        <div>বোর্ডে মোট বাজি: <span id="totalPool">1,31,251</span> 🪙</div>
    </div>

    <div class="game-area">
        <!-- Slot Bowl -->
        <div class="slot-container">
            <div class="bowl" id="bowl">
                <div class="bowl-inner" id="bowlInner">❓</div>
            </div>
        </div>

        <div class="status-text" id="statusText">যেকোনো ঘরে পছন্দমতো কয়েন ধরুন!</div>

        <!-- 8 Item Grid Boxes -->
        <div class="item-grid">
            <!-- Row 1: Top 4 Boxes -->
            <div class="item-card" id="card-bucket" onclick="placeBet('bucket', '🪣')">
                <span class="item-icon">🪣</span>
                <span class="item-name">বালতি</span>
                <span class="user-bet" id="bet-bucket">🪙 0</span>
            </div>
            <div class="item-card" id="card-mug" onclick="placeBet('mug', '🥛')">
                <span class="item-icon">🥛</span>
                <span class="item-name">মগ</span>
                <span class="user-bet" id="bet-mug">🪙 0</span>
            </div>
            <div class="item-card" id="card-flower" onclick="placeBet('flower', '🌸')">
                <span class="item-icon">🌸</span>
                <span class="item-name">ফুল</span>
                <span class="user-bet" id="bet-flower">🪙 0</span>
            </div>
            <div class="item-card" id="card-star" onclick="placeBet('star', '⭐')">
                <span class="item-icon">⭐</span>
                <span class="item-name">তারা</span>
                <span class="user-bet" id="bet-star">🪙 0</span>
            </div>

            <!-- Row 2: Bottom 4 Boxes -->
            <div class="item-card" id="card-diamond" onclick="placeBet('diamond', '💎')">
                <span class="item-icon">💎</span>
                <span class="item-name">ডায়মন্ড</span>
                <span class="user-bet" id="bet-diamond">🪙 0</span>
            </div>
            <div class="item-card" id="card-crown" onclick="placeBet('crown', '👑')">
                <span class="item-icon">👑</span>
                <span class="item-name">মুকুট</span>
                <span class="user-bet" id="bet-crown">🪙 0</span>
            </div>
            <div class="item-card" id="card-gift" onclick="placeBet('gift', '🎁')">
                <span class="item-icon">🎁</span>
                <span class="item-name">উপহার</span>
                <span class="user-bet" id="bet-gift">🪙 0</span>
            </div>
            <div class="item-card" id="card-heart" onclick="placeBet('heart', '❤️')">
                <span class="item-icon">❤️</span>
                <span class="item-name">হার্ট</span>
                <span class="user-bet" id="bet-heart">🪙 0</span>
            </div>
        </div>

        <!-- Custom Coin Input (+ / - & Type Input) -->
        <div class="coin-controls">
            <div class="input-group">
                <button class="btn-qty" onclick="stepCoin('down')">-</button>
                <input type="number" id="customCoin" class="coin-input" value="100" min="10" step="10">
                <button class="btn-qty" onclick="stepCoin('up')">+</button>
            </div>
            
            <div class="chips-presets">
                <div class="chip-btn" onclick="setCoin(100)">100</div>
                <div class="chip-btn" onclick="setCoin(500)">500</div>
                <div class="chip-btn" onclick="setCoin(1000)">1K</div>
                <div class="chip-btn" onclick="setCoin(5000)">5K</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div>কয়েন ব্যালেন্স: <span style="color:#ffcc00; font-weight:bold;" id="balance">50,000</span> 🪙</div>
    </div>
</div>

<script>
    let balance = 50000;
    let timeLeft = 35;
    let timerInterval = null;
    let userBets = {};
    let isBettingOpen = true;
    let totalPoolCount = 131251;

    const items = [
        { id: 'bucket', name: 'বালতি', icon: '🪣' },
        { id: 'mug', name: 'মগ', icon: '🥛' },
        { id: 'flower', name: 'ফুল', icon: '🌸' },
        { id: 'star', name: 'তারা', icon: '⭐' },
        { id: 'diamond', name: 'ডায়মন্ড', icon: '💎' },
        { id: 'crown', name: 'মুকুট', icon: '👑' },
        { id: 'gift', name: 'উপহার', icon: '🎁' },
        { id: 'heart', name: 'হার্ট', icon: '❤️' }
    ];

    const timerEl = document.getElementById('timer');
    const customCoinInput = document.getElementById('customCoin');
    const statusText = document.getElementById('statusText');
    const bowl = document.getElementById('bowl');
    const bowlInner = document.getElementById('bowlInner');

    // Dynamic Step Increment Logic
    function stepCoin(direction) {
        let current = parseInt(customCoinInput.value) || 100;
        let step = 50;

        if (current >= 10000) step = 1000;
        else if (current >= 1000) step = 500;
        else step = 50;

        if (direction === 'up') current += step;
        else if (direction === 'down') current = Math.max(10, current - step);

        customCoinInput.value = current;
    }

    function setCoin(amount) {
        customCoinInput.value = amount;
    }

    // 35 Seconds Timer Loop
    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 35;
        isBettingOpen = true;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            let sec = timeLeft < 10 ? '0' + timeLeft : timeLeft;
            timerEl.innerText = `00:${sec}`;

            if(isBettingOpen && timeLeft % 3 === 0) {
                totalPoolCount += Math.floor(Math.random() * 800) + 200;
                document.getElementById('totalPool').innerText = totalPoolCount.toLocaleString();
            }

            if (timeLeft === 5) {
                isBettingOpen = false;
                statusText.innerText = "⏳ বেটিং বন্ধ! বাটি ঘোড়ানো হচ্ছে...";
            }

            if (timeLeft === 0) {
                clearInterval(timerInterval);
                revealSlotResult();
            }
        }, 1000);
    }

    function placeBet(itemId, icon) {
        if (!isBettingOpen) {
            alert("এই রাউন্ডের সময় শেষ! পরের রাউন্ডের জন্য অপেক্ষা করুন।");
            return;
        }

        let betAmount = parseInt(customCoinInput.value);
        if (isNaN(betAmount) || betAmount <= 0) {
            alert("দয়া করে সঠিক কয়েন পরিমাণ লিখুন!");
            return;
        }

        if (balance < betAmount) {
            alert("আপনার পর্যাপ্ত কয়েন ব্যালেন্স নেই!");
            return;
        }

        balance -= betAmount;
        userBets[itemId] = (userBets[itemId] || 0) + betAmount;
        totalPoolCount += betAmount;

        document.getElementById('balance').innerText = balance.toLocaleString();
        document.getElementById('balanceHeader').innerText = balance.toLocaleString();
        document.getElementById(`bet-${itemId}`).innerText = `🪙 ${userBets[itemId].toLocaleString()}`;
        document.getElementById(`card-${itemId}`).classList.add('selected');
        document.getElementById('totalPool').innerText = totalPoolCount.toLocaleString();
        
        statusText.innerText = `${icon} ঘরে ${betAmount} কয়েন ধরা হয়েছে!`;
    }

    function revealSlotResult() {
        statusText.innerText = "🎰 বাটি ঘুরছে...";
        bowl.classList.add('slide-out');

        setTimeout(() => {
            let winItem = items[Math.floor(Math.random() * items.length)];

            bowlInner.innerText = winItem.icon;
            bowl.classList.remove('slide-out');

            let winCoins = (userBets[winItem.id] || 0) * 8; // 1:8 Win Payout

            if (winCoins > 0) {
                balance += winCoins;
                statusText.innerText = `🎉 বিজয়ী আইটেম ${winItem.icon} (${winItem.name})! আপনি ${winCoins} কয়েন পেয়েছেন!`;
            } else {
                statusText.innerText = `❌ বিজয়ী আইটেম ${winItem.icon} (${winItem.name})! আবার চেষ্টা করুন।`;
            }

            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('balanceHeader').innerText = balance.toLocaleString();

            setTimeout(() => {
                resetRound();
                startTimer();
            }, 4000);

        }, 1000);
    }

    function resetRound() {
        userBets = {};
        items.forEach(item => {
            document.getElementById(`bet-${item.id}`).innerText = '🪙 0';
            document.getElementById(`card-${item.id}`).classList.remove('selected');
        });
        bowlInner.innerText = '❓';
        statusText.innerText = "নতুন রাউন্ড শুরু হয়েছে! পছন্দমতো ঘরে কয়েন ধরুন।";
    }

    startTimer();
</script>

</body>
</html>
